<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="YACHAY GO - Plataforma educativa offline para niños de zonas rurales">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌟</text></svg>">
    <title>YACHAY GO - Aprende Jugando</title>
    <style>
        /* Estilos optimizados */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 30px; padding: 30px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 2.5em; margin-bottom: 10px; }
        h1 { color: #667eea; font-size: 2em; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 1em; }
        .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 30px 20px; border-radius: 20px; font-size: 1.2em; cursor: pointer; transition: transform 0.2s; font-weight: bold; }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .back-btn { background: #ff6b6b; color: white; border: none; padding: 12px 25px; border-radius: 15px; cursor: pointer; margin-bottom: 20px; }
        .option-btn { background: white; border: 3px solid #667eea; padding: 15px; border-radius: 15px; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold; }
        .option-btn:hover { background: #667eea; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div id="mainScreen" class="screen active">
            <div class="header">
                <div class="logo">🌟</div>
                <h1>YACHAY GO</h1>
                <p class="subtitle">¡Aprende y Diviértete sin Internet!</p>
            </div>
            <div class="menu">
                <button class="menu-btn" onclick="showScreen('mathScreen')">🔢 Matemáticas</button>
                <button class="menu-btn" onclick="showScreen('readingScreen')">📖 Lectura</button>
            </div>
        </div>

        <div id="mathScreen" class="screen">
            <button class="back-btn" onclick="showScreen('mainScreen')">← Volver</button>
            <div id="mathQuestion"></div>
        </div>

        <div id="readingScreen" class="screen">
            <button class="back-btn" onclick="showScreen('mainScreen')">← Volver</button>
            <div id="storyText"></div>
        </div>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
        // Tu lógica de JS permanece aquí...
    </script>
</body>
</html>
